# fly.toml app configuration file generated for burkina-environnement on 2026-08-17T18:26:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'burkina-environnement'
primary_region = 'cdg'

[build]
[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
